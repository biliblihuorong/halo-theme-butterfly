apiVersion: theme.halo.run/v1alpha1
kind: Theme
metadata:
  name: theme-butterfly-shell
spec:
  displayName: Butterfly-shell
  author:
    name: shell
    website: "https://github.com/biliblihuorong"
  description: "基于 Butterfly Halo 移植版的社区派生主题，由 shell 独立维护，不代表 Halo 官方或上游维护者。"
  logo: "/themes/theme-butterfly-shell/assets/img/logo.png"
  homepage: "https://github.com/biliblihuorong/halo-theme-butterfly"
  repo: "https://github.com/biliblihuorong/halo-theme-butterfly.git"
  issues: "https://github.com/biliblihuorong/halo-theme-butterfly/issues"
  license:
    - name: GPL-3.0
      url: "https://github.com/biliblihuorong/halo-theme-butterfly/blob/master/LICENSE"
  settingName: theme-butterfly-shell-setting
  configMapName: theme-butterfly-shell-configmap
  version: 2.3.5
  requires: ">=2.0.0"
  customTemplates:
    page:
      - name: "友情链接 (Links)"
        file: links.html
      - name: "瞬间 (Moments)"
        file: moments.html
      - name: "相册 (Photos)"
        file: photos.html
      - name: "归档 (Archives)"
        file: archives.html
      - name: "分类列表 (Categories)"
        file: categories.html
      - name: "标签列表 (Tags)"
        file: tags.html
