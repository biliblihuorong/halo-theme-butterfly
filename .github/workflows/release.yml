name: Verify and release

on:
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Regression tests
        run: pnpm test
      - name: Build and verify release artifacts
        run: pnpm build-zip
      - name: Check ZIP contents
        run: |
          unzip -t theme-butterfly-dist.zip
          sha256sum -c theme-butterfly-dist.zip.sha256
      - name: Package version
        id: version
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: butterfly-${{ steps.version.outputs.version }}
          path: |
            theme-butterfly-dist.zip
            theme-butterfly-dist.zip.sha256
            theme-butterfly-dist.zip.manifest.json
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: butterfly-${{ needs.verify.outputs.version }}
      - name: Verify downloaded package
        run: sha256sum -c theme-butterfly-dist.zip.sha256
      - name: Create a release without replacing existing versions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --latest \
            --title "Butterfly-shell $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md" \
            theme-butterfly-dist.zip \
            theme-butterfly-dist.zip.sha256 \
            theme-butterfly-dist.zip.manifest.json
