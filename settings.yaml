                  value: false
            - $formkit: radio
              name: footer_content_type
              label: 申请说明格式
              help: Markdown 会在前端渲染（支持表格、代码块、引用等 GFM 语法）；HTML 则原样输出
              value: markdown
              options:
                - label: Markdown
                  value: markdown
                - label: HTML
                  value: html
            - $formkit: textarea
              name: footer_content
              label: 友链申请说明
              placeholder: 请填写申请要求、本站信息或移出友链的记录
              help: 显示在友链列表与评论之间，支持申请规则、本站信息和移出记录；格式跟随上方「申请说明格式」设置
              rows: 18
              value: |
                欢迎交换签订契约（友链）（ˊᗜˋ）

                有以下注意事项：

                1. 请确保网站启用 `https`，友联仅添加双向友联。

                2. 请确保网站内容符合中国大陆法律法规

                3. 交换友链我会收集以下关键信息并保存

                   - 站长昵称

                   - 站点名字

                   - 站点 URL

                   - 站点头像

                   - 站点简述

                   - 以及您的邮箱地址，有了它我可以更快的联系到您，以及博客的评论回复才正常运行

                   具体详细跳转到：[隐私政策](/privacy-policy/ "隐私政策")

                4. 友联会在 T+7 完成（如站长繁忙可能会延期添加）。

                5. 我会不定时去访问，请确保您的网站一直稳定，长时间无法访问就会被我解除契约哦。

                6. 在友联列表的站点如果被清理，我会在下方的表格里面写出来，并且如果站点本身已经打不开会附带上互联网档案馆的快照链接。

                7. 希望交换友链时，请保留我的头像，有可能本站图片会开启防盗链。

                ★名称：某科学的贝壳

                ★简述：Get busy living or get busy dying.

                ★URL：https://blog.ning.moe

                ★ico头像：https://img.ning.moe/i/1/23/01/30/63d755db9649a.ico

                ★webp头像：https://img.ning.moe/i/1/23/01/30/63d7559a451ec.webp （推荐）

                以下已经被解除契约的列表

                | 网站名字           | 解除时间   | 理由             | 互联网档案馆链接 or 原站链接                                 |
                | ------------------ | ---------- | ---------------- | ------------------------------------------------------------ |
                | NekoX              | 2024-06-05 | 网站404          | https://web.archive.org/web/20210612142421/https://nekox.cn/ |
                | WhatZ的小窝        | 2024-06-05 | 网站404          | https://web.archive.org/web/20201024011103/https://b.cupmoexpz.tk/ |
                | OvORizhi           | 2024-06-05 | 网站404          | https://web.archive.org/web/20230724082931/https://ovorizhi.com/ |
                | Leo's Blog         | 2024-06-05 | 网站404          | https://web.archive.org/web/20230401101904/https://leo.moe/  |
