    #Umami 统计设置
    - group: umami
      label: Umami 统计
      formSchema:
        - $formkit: radio
          name: enable
          label: 启用 Umami 统计
          help: 启用后将从 Umami 获取网站总访问量并显示在侧边栏
          value: false
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: text
          name: url
          label: Umami 地址
          placeholder: "https://your-umami.example.com"
          help: Umami 实例的完整地址（不含末尾斜杠）
          value: ""
        - $formkit: text
          name: share_id
          label: 分享链接 ID
          placeholder: "ICj6V0LQbbZ4XjTe"
          help: 在 Umami 后台 网站设置 -> 分享链接（Share URL）中开启后，复制链接 /share/ 后面的 ID。使用公开 API 获取访问量，无需账号密码，凭据不会暴露给访客
          value: ""
        - $formkit: number
          name: cache_minutes
          label: 缓存时间（分钟）
          help: 访问量数据的本地缓存时间，避免频繁请求
          value: 30
          min: 5
          max: 1440
    #评论设置
    - group: comment
      label: 评论设置
      formSchema:
        - $formkit: radio
          name: provider
          id: comment_provider
          key: comment-provider
          label: 评论系统
          value: "none"
          options:
            - label: 关闭
              value: "none"
            - label: Artalk
              value: "artalk"
            - label: Halo 评论插件
              value: "halo"
        - $formkit: switch
          key: artalk-enable-post
          name: artalk_enable_post
          label: 在文章页启用 Artalk
          help: 文章自身还需要开启“允许评论”
          value: true
          if: "$get(comment_provider).value == 'artalk'"
        - $formkit: switch
          key: artalk-enable-page
          name: artalk_enable_page
          label: 在普通页面启用 Artalk
          help: 独立页面自身还需要开启“允许评论”
          value: true
          if: "$get(comment_provider).value == 'artalk'"
        - $formkit: switch
          key: artalk-enable-links
          name: artalk_enable_links
          label: 在友链页启用 Artalk
          help: 友链对应的独立页面还需要开启“允许评论”
          value: true
          if: "$get(comment_provider).value == 'artalk'"
        - $formkit: switch
          key: artalk-enable-friends
          name: artalk_enable_friends
          id: artalk_enable_friends
          label: 在朋友圈启用 Artalk
          help: 朋友圈不是 Halo 独立页面，将使用下方单独配置的 pageKey
          value: true
          if: "$get(comment_provider).value == 'artalk'"
        - $formkit: text
          key: artalk-friends-page-key
          name: artalk_friends_page_key
          label: 朋友圈 pageKey
          placeholder: "/friends"
          value: "/friends"
          help: 用于在 Artalk 中唯一标识朋友圈评论，修改后旧评论不会自动迁移
          if: "$get(comment_provider).value == 'artalk' && $get(artalk_enable_friends).value == true"
          validation: required
        - $formkit: text
          key: artalk-friends-page-title
          name: artalk_friends_page_title
          label: 朋友圈页面标题
          placeholder: "朋友圈"
          value: "朋友圈"
          help: 显示在 Artalk 控制中心和通知中的页面名称
          if: "$get(comment_provider).value == 'artalk' && $get(artalk_enable_friends).value == true"
          validation: required
        - $formkit: text
          key: artalk-server
          name: artalk_server
          label: Artalk 服务端
          placeholder: "https://artalk.example.com"
          value: "https://artalk.example.com"
          help: Artalk 后端 API 地址，请填写浏览器能够访问的 HTTPS 地址，末尾不要带 /
          if: "$get(comment_provider).value == 'artalk'"
          validation: required|url
        - $formkit: text
          key: artalk-site
          name: artalk_site
          label: Artalk 站点名
          placeholder: "my-site"
          value: "my-site"
          help: 必须与 Artalk 控制中心中的站点名称完全一致，用于隔离不同站点的评论
          if: "$get(comment_provider).value == 'artalk'"
          validation: required
        - $formkit: select
          key: artalk-asset-source
          name: artalk_asset_source
          id: artalk_asset_source
          label: Artalk 客户端资源
          value: "local"
          help: 主题内置最稳定；服务端资源使用 Artalk 后端的 /dist/Artalk.js 和 Artalk.css；自定义可填写 CDN 地址
          if: "$get(comment_provider).value == 'artalk'"
          options:
            - label: 主题内置
              value: "local"
            - label: Artalk 服务端
              value: "server"
            - label: 自定义地址
              value: "custom"
        - $formkit: url
          key: artalk-custom-js
          name: artalk_custom_js
          label: Artalk JS 地址
          placeholder: "https://cdn.example.com/Artalk.js"
          help: 仅在客户端资源选择“自定义地址”时使用
          if: "$get(comment_provider).value == 'artalk' && $get(artalk_asset_source).value == 'custom'"
          validation: url
        - $formkit: url
          key: artalk-custom-css
          name: artalk_custom_css
          label: Artalk CSS 地址
          placeholder: "https://cdn.example.com/Artalk.css"
          help: 仅在客户端资源选择“自定义地址”时使用
          if: "$get(comment_provider).value == 'artalk' && $get(artalk_asset_source).value == 'custom'"
          validation: url
        - $formkit: select
          key: artalk-locale
          name: artalk_locale
          label: Artalk 客户端语言
          value: "zh-CN"
          help: 只影响评论组件界面语言；选择自动时跟随访客浏览器
          if: "$get(comment_provider).value == 'artalk'"
          options:
            - label: 简体中文
              value: "zh-CN"
            - label: 繁體中文
              value: "zh-TW"
            - label: 自动
              value: "auto"
            - label: English
              value: "en"
            - label: 日本語
              value: "ja"
            - label: 한국어
              value: "ko"
            - label: Français
              value: "fr"
            - label: Русский
              value: "ru"
        - $formkit: radio
          key: artalk-prefer-remote-conf
          name: prefer_remote_conf
          label: 优先使用远程界面配置
          help: 启用后优先采用 Artalk 控制中心中的界面配置；关闭时优先采用主题传入的客户端配置
          value: false
          if: "$get(comment_provider).value == 'artalk'"
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: attachment
          key: artalk-extra-css
          name: artalk_css
          label: 额外 CSS 覆盖（可选）
          help: 在 Artalk 基础样式之后加载，用于覆盖评论组件样式；留空则不加载
          if: "$get(comment_provider).value == 'artalk'"
        - $formkit: radio
          key: artalk-pagekey-trailing-slash
          name: pagekey_trailing_slash
          label: pageKey 末尾追加 /
          help: 用于兼容旧评论数据；新部署请根据 Artalk 中已有的页面键格式选择
          value: true
          if: "$get(comment_provider).value == 'artalk'"
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
    #性能优化
    - group: performance
      label: 性能优化
      formSchema:
        - $formkit: textarea
          name: preconnect
          label: 预连接 (preconnect)
          help: 每行一个 URL(含 https://),会插入 <link rel="preconnect"> 提前建立 TCP/TLS。建议 2~4 个,过多会适得其反。
          value: ""
          rows: 6
        - $formkit: textarea
          name: dns_prefetch
          label: DNS 预解析 (dns-prefetch)
          help: 每行一个域名(可带协议也可只写主机名),只做 DNS 解析,适合不确定会不会用到的 CDN。
          rows: 4
        - $formkit: radio
          name: preview_enable
          id: preview_enable
          key: preview_enable
          label: 图片预览图
          help: 图床能生成缩略图时开启。文章列表封面只加载预览图；首屏背景和正文图片先显示预览图，原图加载完成后替换；预览图加载失败时直接使用原图，点击放大始终使用原图
          value: false
          options:
            - label: 启用
              value: true
            - label: 禁用
              value: false
        - $formkit: radio
          name: preview_mode
          id: preview_mode
          key: preview_mode
          label: 预览图地址规则
          value: query
          if: "$get(preview_enable).value"
          options:
            - label: 追加查询参数（a.webp → a.webp?w=400）
              value: query
            - label: 替换路径前缀（/i/a.webp → /thumbnails/a.webp）
              value: path
            - label: 文件名后缀（a.webp → a_thumb.webp）
              value: suffix
        - $formkit: text
          name: preview_query
          key: preview_query
          label: 查询参数
          help: 追加到原图地址的参数，例如 w=400 或 thumbnail=1；原图已有参数时自动用 & 连接
          value: ""
          if: "$get(preview_enable).value && $get(preview_mode).value == 'query'"
        - $formkit: text
          name: preview_path_from
          key: preview_path_from
          label: 原图路径前缀
          help: 只处理以此开头的路径，例如 /i/
          value: ""
          if: "$get(preview_enable).value && $get(preview_mode).value == 'path'"
        - $formkit: text
          name: preview_path_to
          key: preview_path_to
          label: 预览图路径前缀
          help: 替换后的前缀，例如 /thumbnails/
          value: ""
          if: "$get(preview_enable).value && $get(preview_mode).value == 'path'"
        - $formkit: text
          name: preview_suffix
          key: preview_suffix
          label: 文件名后缀
          help: 插入到扩展名之前，例如 _thumb 或 .small
          value: ""
          if: "$get(preview_enable).value && $get(preview_mode).value == 'suffix'"
        - $formkit: textarea
          name: preview_hosts
          key: preview_hosts
          label: 应用预览图的图床域名
          help: 每行一个域名，例如 img.example.com。留空时只处理本站域名下的图片，避免为外部图片请求不存在的预览图
          value: ""
          rows: 3
          if: "$get(preview_enable).value"
