<layout
  th:replace="~{views/layout :: layout (
  page = 'single',
  title = ${singlePage.spec.title} ,
  pin = ~{::pin},
  header = ~{::header},
  main = ~{::main}
  )}"
>
  <!--/* pin */-->
  <th:block th:fragment="pin">
    <script id="pageScript" data-cfasync="false" th:inline="javascript" th:with="above_background = ${not #strings.isEmpty(singlePage.spec.cover) ? singlePage.spec.cover : theme.config.index.above_background}">
      Object.assign(window.MainApp.conf, {
        //第一屏
        enable_above: /*[[${theme.config.index.enable_above}]]*/ '',
        above_background: /*[[${above_background}]]*/ '',
        // 评论
        comment: {
          provider: /*[[${theme.config.comment?.provider ?: 'none'}]]*/ 'none',
        },
      });
    </script>
    <th:block th:replace="~{views/render-config :: config(${singlePage})}"/>
  </th:block>


  <!--/* header */-->
  <th:block th:fragment="header">
    <header th:class="${not theme.config.index.enable_above ? 'header dp' : 'header'}">
      <!--/* 导航栏 */-->
      <th:block th:replace="~{views/nav}"/>

      <!--第一屏内容-->
      <section class="above" th:if="${theme.config.index.enable_above}">
        <div class="above-info">
          <h1 class="above-title" th:text="${singlePage.spec.title}"></h1>
        </div>
      </section>
    </header>
  </th:block>


  <!--/* 內容 */-->
  <th:block th:fragment="main">
    <section class="content card">
      <h1 class="content-title" th:unless="${theme.config.index.enable_above}" th:text="${singlePage.spec.title}"></h1>
      <!--/* 正文图片统一原生懒加载；启用预览图时，解析完正文立即换成预览图（此时懒加载图片尚未请求） */-->
      <article class="render" th:utext="${#strings.replace(singlePage.content.content, '<img ', '<img loading=&quot;lazy&quot; decoding=&quot;async&quot; ')}"></article>
      <script data-cfasync="false" th:if="${theme.config.performance?.preview_enable ?: false}">window.MainApp.usePreviewImages(document.currentScript.previousElementSibling);</script>
      <halo:comment
        th:if="${pluginFinder.available('PluginCommentWidget') && (theme.config.comment?.provider ?: 'none') == 'halo' && (singlePage.spec.allowComment ?: true)}"
        group="content.halo.run"
        kind="SinglePage"
        th:attr="name=${singlePage.metadata.name}"
      ></halo:comment>
      <th:block th:replace="~{views/artalk :: comment(
        ${singlePage.status.permalink},
        ${singlePage.spec.title},
        ${(singlePage.spec.allowComment ?: true) && (theme.config.comment?.artalk_enable_page ?: true)}
      )}"/>
    </section>
    <th:block th:replace="~{views/aside::common}"/>
  </th:block>
</layout>
