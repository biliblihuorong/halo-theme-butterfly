<th:block
  xmlns:th="https://www.thymeleaf.org"
  th:with="
     assets_site = ${#strings.endsWith(#theme.assets('/'), '/') ? #theme.assets('/') : #theme.assets('/') + '/'},
     assets_source = ${theme.config.loading?.source},
     assets_type = ${assets_source?.type ?: 'site'},
     assets_selected = ${assets_type == 'site' ? assets_source?.site : (assets_type == 'custom' ? assets_source?.custom : (assets_type == 'npm' ? assets_source?.npm : null))},
     assets_link = ${#strings.isEmpty(assets_selected) or (assets_type == 'site' and (assets_selected == '/themes/theme-butterfly/assets/' or assets_selected == '/themes/theme-butterfly-shell/assets/')) ? assets_site : assets_selected},
     param_prefix = ${theme.config.loading.img != null and #strings.containsIgnoreCase(theme.config.loading.img.random_link,'?') ? '&' : '?'},
     loading_enabled = ${theme.config.loading.type != null and theme.config.loading.type != 'null'},
     loading_timeout = ${theme.config.loading.timeout ?: 3000}
  "
  th:fragment="layout (page,title,pin,header,main)"
>
  <!DOCTYPE html>
  <html lang="zh-CN" data-color-scheme="light">
  <head>
    <meta charset="UTF-8"/>
    <title th:text="${title}"></title>
    <!--/* Halo 的受限 SpEL 禁止 T(java.lang.System)；&#10; 会在模板解析阶段解码为真实换行符，用于按行拆分。 */-->
    <th:block th:each="line : ${#strings.listSplit(theme.config.performance?.preconnect, '&#10;')}">
      <link th:if="${not #strings.isEmpty(#strings.trim(line))}" rel="preconnect" th:href="${#strings.trim(line)}" crossorigin />
    </th:block>
    <th:block th:each="line : ${#strings.listSplit(theme.config.performance?.dns_prefetch, '&#10;')}">
      <link th:if="${not #strings.isEmpty(#strings.trim(line))}" rel="dns-prefetch" th:href="${#strings.startsWith(#strings.trim(line), '//') or #strings.contains(#strings.trim(line), '://') ? #strings.trim(line) : '//' + #strings.trim(line)}" />
    </th:block>
    <!--/* 公共样式和页面样式都同步加载，首屏直接按当前页面样式绘制，避免先按首页样式画出再切换 */-->
    <link rel="stylesheet" th:href="|${assets_link}css/common.min.css?v=${theme.spec.version}|">
    <link th:unless="${page == null}" rel="stylesheet" th:href="${assets_link + 'css/' + page + '.min.css?v=' + theme.spec.version}">
    <!--/* TemplateHeadProcessor 会自动处理标准 head；halo:head 会让浏览器提前结束 head。 */-->
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no, viewport-fit=cover">
    <meta name="site" th:content="${site.url}">
    <!--/* canonical、Open Graph、Twitter Card 和描述统一由 Halo 的 HeadProcessor 注入。 */-->
    <th:block th:replace="~{views/config}"/>
    <th:block th:replace="${pin}"/>
    <!--/* 首屏背景图在解析 head 时就开始高优先级下载，不再等主题脚本执行；随机图 API 每次返回不同图片，不预加载 */-->
    <script data-cfasync="false">
      (function (conf) {
        // 旧配置中的内置默认图跟随当前主题目录；自定义图片和 CDN 地址保持原值。
        if(conf.above_background === '/themes/theme-butterfly/assets/img/default-banner.png') {
          conf.above_background = conf.assets_site + 'img/default-banner.png';
        }
        var src = conf.enable_above && conf.above_background;
        if(!src || src === conf.random_link) return;
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.href = window.MainApp.usePreview(src);
        link.setAttribute('fetchpriority', 'high');
        document.head.appendChild(link);
      })(window.MainApp.conf);
    </script>
  </head>

  <body th:classappend="${loading_enabled ? 'loading' : ''}" th:with="stats = ${siteStatsFinder.getStats()},contributor = ${contributorFinder.getContributor(theme.config.base.metadata_name)},menuItems = ${menuFinder.getPrimary().menuItems},tagTotal = ${tagFinder.list(1,1).total}">
  <script th:if="${loading_enabled}" th:inline="javascript" data-cfasync="false">
    window.setTimeout(function() {
      document.body.classList.remove('loading');
    }, /*[[${loading_timeout}]]*/ 3000);
  </script>
  <script
    defer
    th:if="${loading_enabled}"
    th:src="${assets_link + 'plugins/loading/' + theme.config.loading.type + '.min.js?v=' + theme.spec.version}"
    th:data-timeout="${loading_timeout}"
    onerror="document.body.classList.remove('loading')"
  ></script>

  <div id="Butterfly" th:class="${page}">
    <th:block th:replace="${header}"></th:block>

    <main class="main" th:classappend="${theme.config.aside.enable ? theme.config.aside.position : '' }" th:insert="${main}"></main>

    <th:block th:replace="~{views/footer}"/>

    <th:block th:replace="~{views/components::side}"/>
  </div>

  <!--/* common.min.js 为各页面共享依赖，须在页面脚本之前加载 */-->
  <script defer th:src="${assets_link + 'js/common.min.js?v=' + theme.spec.version }"></script>
  <script defer th:src="${assets_link + 'js/' + (page ?: 'index') + '.min.js?v=' + theme.spec.version }"></script>
  </body>
  </html>
</th:block>
