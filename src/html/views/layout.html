<th:block
  xmlns:th="https://www.thymeleaf.org"
  th:with="
     assets_link = ${theme.config.loading.source instanceof T(java.util.Map) and theme.config.loading.source.type != null ? theme.config.loading.source[theme.config.loading.source.type] : '/themes/theme-butterfly/assets/'},
     param_prefix = ${theme.config.loading.img != null and #strings.containsIgnoreCase(theme.config.loading.img.random_link,'?') ? '&' : '?'},
     loading_enabled = ${theme.config.loading.type != null and theme.config.loading.type != 'null'},
     loading_timeout = ${theme.config.loading.timeout ?: 3000}
  "
  th:fragment="layout (page,title,pin,header,main)"
>
  <!DOCTYPE html>
  <html lang="zh-CN" data-color-scheme="light">
  <head>
    <meta charset="UTF-8"/>
    <title th:text="${title}"></title>
    <!--/* Halo 的受限 SpEL 禁止 T(java.lang.System)；&#10; 会在模板解析阶段解码为真实换行符，用于按行拆分。 */-->
    <th:block th:each="line : ${#strings.listSplit(theme.config.performance?.preconnect, '&#10;')}">
      <link th:if="${not #strings.isEmpty(#strings.trim(line))}" rel="preconnect" th:href="${#strings.trim(line)}" crossorigin />
    </th:block>
    <th:block th:each="line : ${#strings.listSplit(theme.config.performance?.dns_prefetch, '&#10;')}">
      <link th:if="${not #strings.isEmpty(#strings.trim(line))}" rel="dns-prefetch" th:href="${#strings.startsWith(#strings.trim(line), '//') or #strings.contains(#strings.trim(line), '://') ? #strings.trim(line) : '//' + #strings.trim(line)}" />
    </th:block>
    <link rel="stylesheet" th:href="|${assets_link}css/index.min.css?v=${theme.spec.version}|" media="all">
    <!--/* TemplateHeadProcessor 会自动处理标准 head；halo:head 会让浏览器提前结束 head。 */-->
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no, viewport-fit=cover">
    <meta name="site" th:content="${site.url}">
    <!--/* canonical、Open Graph、Twitter Card 和描述统一由 Halo 的 HeadProcessor 注入。 */-->
    <th:block th:replace="~{views/config}"/>
    <th:block th:replace="${pin}"/>
    <!--/* index 页的 page css 与上方 index.min.css 相同，跳过避免重复声明 */-->
    <th:block th:unless="${page == null or page == 'index'}">
      <link rel="preload" th:href="${assets_link + 'css/' + page + '.min.css?v=' + theme.spec.version}" as="style">
      <link rel="stylesheet" th:href="${assets_link + 'css/' + page + '.min.css?v=' + theme.spec.version}" media="print" onload="this.media='all'">
    </th:block>
  </head>

  <body th:classappend="${loading_enabled ? 'loading' : ''}" th:with="stats = ${siteStatsFinder.getStats()},contributor = ${contributorFinder.getContributor(theme.config.base.metadata_name)}">
  <script th:if="${loading_enabled}" th:inline="javascript">
    window.setTimeout(function() {
      document.body.classList.remove('loading');
    }, /*[[${loading_timeout}]]*/ 3000);
  </script>
  <script
    defer
    th:if="${loading_enabled}"
    th:src="${assets_link + 'plugins/loading/' + theme.config.loading.type + '.min.js?v=' + theme.spec.version}"
    th:data-timeout="${loading_timeout}"
    onerror="document.body.classList.remove('loading')"
  ></script>

  <div id="Butterfly" th:class="${page}">
    <th:block th:replace="${header}"></th:block>

    <main class="main" th:classappend="${theme.config.aside.enable ? theme.config.aside.position : '' }" th:insert="${main}"></main>

    <th:block th:replace="~{views/footer}"/>

    <th:block th:replace="~{views/components::side}"/>
  </div>

  <!--/* common.min.js 为各页面共享依赖，须在页面脚本之前加载 */-->
  <script defer th:src="${assets_link + 'js/common.min.js?v=' + theme.spec.version }"></script>
  <script defer th:src="${assets_link + 'js/' + (page ?: 'index') + '.min.js?v=' + theme.spec.version }"></script>
  </body>
  </html>
</th:block>
