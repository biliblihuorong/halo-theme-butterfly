<!--/* 基础配置 */-->
<!--/* data-cfasync：首屏配置脚本不能被 Cloudflare Rocket Loader 推迟执行，否则配色和预加载都会失效 */-->
<script id="baseScript" th:inline="javascript" data-cfasync="false">
  window.MainApp = {
    conf: {
      style_mode: /*[[${theme.config.style.mode}]]*/ null,
      theme_name: /*[[${theme.metadata.name}]]*/ '',
      theme_version: /*[[${theme.spec.version}]]*/ '',
      enable_aside: /*[[${theme.config.aside.enable}]]*/ true,
      enable_webInfo: /*[[${theme.config.aside.enable_webInfo}]]*/ true,
      assets_site: /*[[${assets_site}]]*/ '',
      assets_link: /*[[${assets_link}]]*/ '',
      // routes 自 Halo 2.22 提供；序列化公开站点模型，避免旧版访问不存在的属性。
      site: /*[[${site}]]*/ {},
      umami: {
        enable: /*[[${theme.config.umami?.enable}]]*/ false,
        url: /*[[${theme.config.umami?.enable ? theme.config.umami?.url : null}]]*/ '',
        shareId: /*[[${theme.config.umami?.enable ? theme.config.umami?.share_id : null}]]*/ '',
        cacheMinutes: /*[[${theme.config.umami?.cache_minutes}]]*/ 30,
      },
      img_err: /*[[${theme.config.loading.img?.err}]]*/ '',
      random_link: /*[[${theme.config.loading.img?.random_enable ? theme.config.loading.img?.random_link : null}]]*/ '',
      preview: {
        enable: /*[[${theme.config.performance?.preview_enable ?: false}]]*/ false,
        mode: /*[[${theme.config.performance?.preview_mode ?: 'query'}]]*/ 'query',
        query: /*[[${theme.config.performance?.preview_query}]]*/ '',
        path_from: /*[[${theme.config.performance?.preview_path_from}]]*/ '',
        path_to: /*[[${theme.config.performance?.preview_path_to}]]*/ '',
        suffix: /*[[${theme.config.performance?.preview_suffix}]]*/ '',
        hosts: /*[[${theme.config.performance?.preview_hosts}]]*/ '',
      },
    },
    attrs: {},
    modules: {},
  };
  // 预览图地址：按主题设置把原图地址转换为图床生成的预览图地址，不适用时返回原地址。
  window.MainApp.usePreview = function (src) {
    var rule = window.MainApp.conf.preview || {};
    if(!rule.enable || !src || /^(data|blob):/i.test(src)) return src;
    var url;
    try {
      url = new URL(src, location.href);
    } catch (_) {
      return src;
    }
    if(rule.mode === 'imgnest' && (!/^https?:$/.test(url.protocol) || url.username || url.password || url.href.split('#')[0].indexOf('?') >= 0)) return src;
    var hosts = String(rule.hosts || '').split(/[\s,]+/).map(function (host) {
      return host.replace(/^[a-z]+:\/\//i, '').replace(/\/.*$/, '').toLowerCase();
    }).filter(Boolean);
    if(hosts.length ? hosts.indexOf(url.host.toLowerCase()) < 0 : url.host !== location.host) return src;
    if(rule.mode === 'imgnest') {
      if(/_thumbs\.webp$/i.test(url.pathname) || !/\.(avif|bmp|gif|heic|heif|jpe?g|png|tiff?|webp)$/i.test(url.pathname)) return src;
      url.pathname = url.pathname.replace(/\.[^./]+$/, '_thumbs.webp');
    } else if(rule.mode === 'query' && rule.query) {
      var query = String(rule.query).replace(/^[?&]+/, '');
      url.search = url.search ? url.search + '&' + query : query;
    } else if(rule.mode === 'path' && rule.path_from && url.pathname.indexOf(rule.path_from) === 0) {
      url.pathname = (rule.path_to || '/') + url.pathname.slice(rule.path_from.length);
    } else if(rule.mode === 'suffix' && rule.suffix && /[^/]$/.test(url.pathname)) {
      url.pathname = url.pathname.replace(/(\.[^./]+)?$/, rule.suffix + '$1');
    } else {
      return src;
    }
    return url.href;
  };
  // 正文图片：解析到正文后立即把 src 换成预览图并记录原图，正文图片已由模板设为懒加载，此时尚未开始请求。
  window.MainApp.usePreviewImages = function (root) {
    if(!root) return;
    Array.prototype.forEach.call(root.querySelectorAll('img[src]:not([srcset])'), function (img) {
      var origin = img.getAttribute('src');
      var preview = window.MainApp.usePreview(origin);
      if(preview === origin) return;
      img.setAttribute('data-origin', origin);
      img.setAttribute('src', preview);
    });
  };
  // 首屏前按与 core/theme.js 相同的规则确定配色，避免先按默认浅色绘制再闪烁切换。
  (function () {
    var root = document.documentElement;
    var mode = window.MainApp.conf.style_mode;
    var scheme = 'light';
    if(mode === 'light' || mode === 'dark') {
      scheme = mode;
    } else if(mode === 'auto') {
      var hour = new Date().getHours();
      scheme = hour >= 6 && hour < 18 ? 'light' : 'dark';
    } else {
      try {
        scheme = localStorage.getItem('data-color-scheme') === 'dark' ? 'dark' : 'light';
      } catch (_) {
        // 浏览器禁止存储时使用页面默认模式。
      }
    }
    root.dataset.colorScheme = scheme;
    // 同步 class 标记，兼容只识别 html.dark 的插件组件。
    root.classList.remove(scheme === 'dark' ? 'light' : 'dark');
    root.classList.add(scheme);
    // 在首屏绘制前恢复阅读宽度；样式只作用于桌面文章和独立页面。
    try {
      if(localStorage.getItem('butterfly-reading-wide') === '1') root.classList.add('reading-wide');
    } catch (_) { /* 存储不可用时保留默认布局 */ }
  })();
</script>

<!--/* style */-->
<style th:inline="css">
  :root {
    --card-border-radius: /*[(${theme.config.style.radius})]*/ 24px;
    --card-box-shadow: /*[(${theme.config.style.shadow})]*/ transparent;
    --link-hover-color: var(--theme);
  }

  html {
    --theme: #1c69ed;
    --body-background: /*[(${theme.config.style.body_background})]*/ transparent;
    --nav-font-color: /*[(${theme.config.nav.font_color.light})]*/ transparent;
    --nav-active-font-color: /*[(${theme.config.nav.active_font_color.light})]*/ transparent;
    --nav-active-hover-font-color: /*[(${theme.config.nav.active_hover_font_color.light})]*/ transparent;
    --nav-active-background-color: /*[(${theme.config.nav.active_background_color.light})]*/ transparent;
    --nav-active-shadow: /*[(${theme.config.nav.active_shadow.light})]*/ transparent;
    --nav-dropdown-background-color: /*[(${theme.config.nav.dropdown_background_color.light})]*/ transparent;
    --nav-dropdown-font-color: /*[(${theme.config.nav.dropdown_font_color.light})]*/ transparent;
    --nav-dropdown-hover-font-color: /*[(${theme.config.nav.dropdown_hover_font_color.light})]*/ transparent;
  }

  html[data-color-scheme=dark] {
    --theme: #3aa675;
    --body-background: rgb(15, 23, 42);
    --nav-font-color: /*[(${theme.config.nav.font_color.dark})]*/ transparent;
    --nav-active-font-color: /*[(${theme.config.nav.active_font_color.dark})]*/ transparent;
    --nav-active-hover-font-color: /*[(${theme.config.nav.active_hover_font_color.dark})]*/ transparent;
    --nav-active-background-color: /*[(${theme.config.nav.active_background_color.dark})]*/ transparent;
    --nav-active-shadow: /*[(${theme.config.nav.active_shadow.dark})]*/ transparent;
    --nav-dropdown-background-color: /*[(${theme.config.nav.dropdown_background_color.dark})]*/ transparent;
    --nav-dropdown-font-color: /*[(${theme.config.nav.dropdown_font_color.dark})]*/ transparent;
    --nav-dropdown-hover-font-color: /*[(${theme.config.nav.dropdown_hover_font_color.dark})]*/ transparent;
  }

  /* 只在遮罩真正显示时锁定滚动；页面 300ms 内就绪时遮罩不会出现 */
  body.loading:has(> .loading-container) {
    overflow: hidden;
  }

  .loading-container {
    position: fixed;
    inset: 0;
    z-index: 100000;
    background: var(--body-background);
    opacity: 0;
    visibility: hidden;
    animation: butterfly-loading-in 0.2s ease 0.3s forwards;
  }

  @keyframes butterfly-loading-in {
    to { opacity: 1; visibility: visible; }
  }

  body:not(.loading) > .loading-container {
    display: none !important;
  }
</style>
<!--/* 预加载每页必用的 ASCII/标点切片；CJK 切片由 unicode-range 按需加载 */-->
<link rel="preload" as="font" type="font/woff2" crossorigin="anonymous" th:if="${theme.config.style.font_family == 'CircularBody'}" th:href="${assets_link + 'font/CircularBody/CircularBody.00.woff2?v=' + theme.spec.version}">
<link rel="preload stylesheet" as="style" th:if="${theme.config.style.font_family != 'null'}" th:href="${assets_link + 'font/' + theme.config.style.font_family + '.min.css?v=' + theme.spec.version}">
<!--/* FontAwesome CSS 异步加载，避免阻塞首屏渲染；图标会在样式加载后出现 */-->
<link rel="stylesheet" th:href="${assets_link + 'plugins/fontawesome/fontawesome.min.css?v=' + theme.spec.version}" media="print" onload="this.media='all'">
<link rel="preload stylesheet" as="style" th:href="${assets_link + 'plugins/cursor/' + 'simple' + '.min.css?v=' + theme.spec.version}">
<!--/* 主题样式在 css/ 目录里通过 var(--cursor-pointer) 使用指针，浏览器会按 css/ 解析相对路径而 404；这里用完整地址覆盖两个变量 */-->
<style th:inline="css">
  body {
    --cursor-default: url([[${assets_link + 'plugins/cursor/simple/default.cur?v=' + theme.spec.version}]]), auto;
    --cursor-pointer: url([[${assets_link + 'plugins/cursor/simple/pointer.cur?v=' + theme.spec.version}]]), auto;
  }
</style>
